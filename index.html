<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMTAC Data Entry Helper (Ultimate Version)</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            gap: 20px;
            height: 100vh;
            box-sizing: border-box;
        }
        .form-panel {
            flex: 1.2;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow-y: auto;
        }
        .output-panel {
            flex: 0.8;
            background: #111827;
            color: #10b981;
            padding: 25px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
        }
        .section-title {
            color: #2563eb;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 5px;
            margin-top: 25px;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 13px;
            color: #374151;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 13px;
        }
        textarea { resize: vertical; height: 50px; }
        pre {
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 13px;
            flex-grow: 1;
            overflow-y: auto;
            margin: 0;
            line-height: 1.4;
        }
        .copy-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .copy-btn:hover { background: #059669; }
    </style>
</head>
<body>

    <div class="form-panel">
        <h2 style="margin-top: 0; margin-bottom: 5px;">TMTAC Full Entry</h2>
        
        <div class="section-title">1. PATIENT INFO & DIAGNOSIS</div>
        <div class="grid-2">
            <div class="form-group"><label>Visit Date</label><input type="date" id="visitDate"></div>
            <div class="form-group"><label>Visit Number</label><input type="text" id="visitNumber" placeholder="e.g. 1"></div>
            <div class="form-group"><label>Weight (kg) - required for calc</label><input type="number" id="weight" placeholder="e.g. 55"></div>
            
            <div class="form-group">
                <label>Diagnosis</label>
                <select id="diagnosis">
                    <option value="Thalassaemia Major">Thalassaemia Major</option>
                    <option value="HB E Beta Thalassaemia">HB E Beta Thalassaemia</option>
                    <option value="HB H Constant Spring">HB H Constant Spring</option>
                    <option value="Others">Others</option>
                </select>
            </div>
            
            <div class="form-group" id="otherDiagDiv" style="display: none;">
                <label>If Others, please specify:</label>
                <input type="text" id="otherDiagnosis" placeholder="Specify diagnosis">
            </div>

            <div class="form-group">
                <label>Transfusional Types</label>
                <select id="transfusionType">
                    <option value="Transfusional Dependant Thalassaemia (TDT)">TDT (Transfusional Dependant)</option>
                    <option value="Non-Transfusional Dependant (NTDT)">NTDT (Non-Transfusional Dependant)</option>
                </select>
            </div>
            
            <div class="form-group" id="transfusionFreqDiv">
                <label>Transfusion Frequency</label>
                <select id="transfusionFreq">
                    <option value="every month">every month</option>
                    <option value="2 weekly">2 weekly</option>
                    <option value="3 weekly">3 weekly</option>
                    <option value="every 2 months">every 2 months</option>
                    <option value="every 3 months">every 3 months</option>
                    <option value="N/A">N/A</option>
                </select>
            </div>
        </div>

        <div class="section-title">2. LAB INVESTIGATIONS</div>
        <div class="grid-2">
            <div class="form-group"><label>Serum Ferritin (ng/mL)</label><input type="number" id="ferritin" placeholder="e.g. 1511.6"></div>
            <div class="form-group"><label>Neutrophil Count</label><input type="text" id="neutrophil" placeholder="e.g. 2.5"></div>
            <div class="form-group"><label>MRI T2* Cardiac (>20ms)</label><input type="text" id="mriCardiac" placeholder="e.g. 45.7"></div>
            <div class="form-group"><label>MRI T2* Liver (<7mg/g)</label><input type="text" id="mriLiver" placeholder="e.g. 19.1"></div>
        </div>

        <div class="section-title">3. IRON CHELATION THERAPY</div>
        
        <!-- Desferoxamine Specific Details -->
        <div style="background: #f8fafc; padding: 15px; border-radius: 6px; border: 1px solid #e2e8f0; margin-bottom: 15px;">
            <div style="font-weight: bold; margin-bottom: 10px; color: #475569; font-size: 14px;">Desferoxamine (SC Infusion) Details</div>
            
            <div class="grid-2">
                <div class="form-group"><label>Dose/Day (mg)</label><input type="number" id="desferoxamine" placeholder="Leave blank if not used"></div>
                <div class="form-group">
                    <label>Frequency (Days/wk)</label>
                    <select id="desfeDays">
                        <option value="5">5 days/week</option>
                        <option value="6">6 days/week</option>
                        <option value="7">7 days/week</option>
                        <option value="4">4 days/week</option>
                        <option value="3">3 days/week</option>
                        <option value="2">2 days/week</option>
                        <option value="1">1 day/week</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group" style="margin-bottom: 20px;"><label>Frequency of Missed Doses</label><input type="text" id="desfeMissed" placeholder="e.g. None, once a week"></div>

            <!-- Preparation & Administration -->
            <div style="padding-top: 15px; border-top: 1px dashed #cbd5e1;">
                <div style="font-weight: 600; margin-bottom: 12px; color: #2563eb; font-size: 13px;">Preparation & Administration</div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Independence</label>
                        <select id="desfeIndep">
                            <option value="Independent">Independent</option>
                            <option value="Dependent on Caregiver">Dependent on Caregiver</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Volume of WFI (ml)</label><input type="text" id="desfeWfi" placeholder="e.g. 10ml"></div>
                    <div class="form-group"><label>Time start/stop infusion</label><input type="text" id="desfeTime" placeholder="e.g. 8pm - 6am"></div>
                    <div class="form-group">
                        <label>Injection Site</label>
                        <select id="desfeSite">
                            <option value="Abdomen">Abdomen</option>
                            <option value="Thighs">Thighs</option>
                            <option value="Arms">Arms</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Rotation of Injection Site</label>
                        <select id="desfeRotation">
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Injection Site Issues</label><input type="text" id="desfeSiteIssues" placeholder="e.g. Redness, Pain (or None)"></div>
                    <div class="form-group"><label>Barriers Encountered</label><input type="text" id="desfeBarriers" placeholder="e.g. Pump issues (or None)"></div>
                    <div class="form-group">
                        <label>Single Use of Needles</label>
                        <select id="desfeSingleUse">
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Correct Disposal of Needles</label>
                        <select id="desfeDisposal">
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Adjunct Therapy (Moved inside Desferoxamine section) -->
            <div style="padding-top: 15px; margin-top: 15px; border-top: 1px dashed #cbd5e1;">
                <div style="font-weight: 600; margin-bottom: 12px; color: #2563eb; font-size: 13px;">Adjunct Therapy (For Desferoxamine)</div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Vitamin C Intake</label>
                        <select id="vitC">
                            <option value="N/A">N/A</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Correct Intake of Vit C</label>
                        <select id="vitCCorrect">
                            <option value="N/A">N/A</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Local Anaesthesia (EMLA)</label>
                        <select id="emla">
                            <option value="N/A">N/A</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Oral Chelation -->
        <div class="grid-2">
            <div class="form-group"><label>Deferiprone Dose</label><input type="text" id="deferiproneDose" placeholder="Leave blank if not used"></div>
            <div class="form-group"><label>Deferasirox Dose</label><input type="text" id="deferasiroxDose" placeholder="Leave blank if not used"></div>
            
            <div class="form-group">
                <label>Overall Compliance</label>
                <select id="compliance">
                    <option value="Claimed compliant, no miss dose">Claimed compliant, no miss dose</option>
                    <option value="1-2 missed doses per week">1-2 missed doses per week</option>
                    <option value=">2 missed doses per week">> 2 missed doses per week</option>
                    <option value="Non-compliant">Non-compliant</option>
                </select>
            </div>
            <div class="form-group"><label>Balance Pill Counts</label><input type="text" id="pillCounts" placeholder="e.g. Half bottle Deferiprone, 30's Deferasirox"></div>
        </div>

        <div class="section-title">4. DRUG ADVERSE EVENT / REACTION MONITORING</div>
        <div class="form-group"><label>Reported Adverse Events</label><textarea id="adverseEvents" style="height: 50px;">N/A (No issues reported)</textarea></div>

        <div class="section-title">5. LIFESTYLE, VACCINATION & OTHERS</div>
        <div class="grid-2">
            <div class="form-group">
                <label>Low-iron diet adherence</label>
                <select id="diet">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>
            <div class="form-group">
                <label>History of Splenectomy</label>
                <select id="splenectomy">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                </select>
            </div>
            <div class="form-group"><label>Physical Activity</label><input type="text" id="physicalActivity" value="Working at restaurant, from day to night"></div>
            <div class="form-group"><label>Vaccines (Influenza/Pneumo...)</label><input type="text" id="vaccines" placeholder="e.g. Up to date"></div>
        </div>

        <div class="section-title">6. PHARMACIST PLAN & TCA</div>
        <div class="form-group"><label>Other Issues (Patient well? Symptoms?)</label><textarea id="otherIssues">Pt well, asymptomatic. Pt claimed compliance to the meds, no miss dose and has good knowledge on the diet.</textarea></div>
        <div class="form-group"><label>Pharmacist Plan</label><textarea id="plan">Suggest to continue all medications. To reassess medication compliance. To monitor Serum Ferritin level.</textarea></div>
        <div class="grid-2">
            <div class="form-group"><label>TCA TMTAC</label><input type="text" id="tcaTmtac" placeholder="Date/Duration"></div>
            <div class="form-group"><label>TCA DR</label><input type="text" id="tcaDr" placeholder="Date/Duration"></div>
        </div>
    </div>

    <div class="output-panel">
        <pre id="clinicalNote"></pre>
        <button class="copy-btn" onclick="copyNote()">Copy Clinical Note</button>
    </div>

    <script>
        const inputs = document.querySelectorAll('input, select, textarea');
        const noteDisplay = document.getElementById('clinicalNote');

        document.getElementById('visitDate').valueAsDate = new Date();

        function generateNote() {
            // Section 1
            const visitDate = document.getElementById('visitDate').value;
            const formattedDate = visitDate ? new Date(visitDate).toLocaleDateString('en-GB') : '';
            const visitNumber = document.getElementById('visitNumber').value || '-';
            const weight = document.getElementById('weight').value; 
            
            let diagnosis = document.getElementById('diagnosis').value;
            const otherDiagDiv = document.getElementById('otherDiagDiv');
            
            if (diagnosis === 'Others') {
                otherDiagDiv.style.display = 'block';
                const otherVal = document.getElementById('otherDiagnosis').value;
                diagnosis = otherVal ? `Others (${otherVal})` : 'Others';
            } else {
                otherDiagDiv.style.display = 'none';
            }

            const transfusionType = document.getElementById('transfusionType').value;
            const transfusionFreqDiv = document.getElementById('transfusionFreqDiv');
            let transfusionFreq = '';
            
            if (transfusionType === 'Non-Transfusional Dependant (NTDT)') {
                transfusionFreqDiv.style.display = 'none';
            } else {
                transfusionFreqDiv.style.display = 'block';
                transfusionFreq = document.getElementById('transfusionFreq').value;
            }
            
            let finalTransfusionText = transfusionType;
            if (transfusionType !== 'Non-Transfusional Dependant (NTDT)' && transfusionFreq && transfusionFreq !== 'N/A') {
                finalTransfusionText += ` (${transfusionFreq})`;
            }

            // Section 2
            const ferritin = document.getElementById('ferritin').value;
            const neutrophil = document.getElementById('neutrophil').value || '-';
            const mriCardiac = document.getElementById('mriCardiac').value || '-';
            const mriLiver = document.getElementById('mriLiver').value || '-';
            
            // Section 3 - Adjuncts
            const vitC = document.getElementById('vitC').value;
            const vitCCorrect = document.getElementById('vitCCorrect').value;
            const emla = document.getElementById('emla').value;
            
            // Section 3 - Desferoxamine specifics
            const desferoxamine = document.getElementById('desferoxamine').value.trim();
            const desfeDays = document.getElementById('desfeDays').value;
            const desfeMissed = document.getElementById('desfeMissed').value.trim();
            
            const desfeIndep = document.getElementById('desfeIndep').value;
            const desfeWfi = document.getElementById('desfeWfi').value.trim() || '-';
            const desfeTime = document.getElementById('desfeTime').value.trim() || '-';
            const desfeSite = document.getElementById('desfeSite').value;
            const desfeRotation = document.getElementById('desfeRotation').value;
            const desfeSiteIssues = document.getElementById('desfeSiteIssues').value.trim() || '-';
            const desfeBarriers = document.getElementById('desfeBarriers').value.trim() || '-';
            const desfeSingleUse = document.getElementById('desfeSingleUse').value;
            const desfeDisposal = document.getElementById('desfeDisposal').value;

            // Section 3 - Oral Chelation
            const deferiproneDose = document.getElementById('deferiproneDose').value.trim();
            const deferasiroxDose = document.getElementById('deferasiroxDose').value.trim();
            const compliance = document.getElementById('compliance').value;
            const pillCounts = document.getElementById('pillCounts').value || '-';

            // Smart Chelation logic & AUTO CALCULATIONS
            let chelationDrugsText = "";
            const isUsed = (val) => val && val.toLowerCase() !== 'nil' && val.toLowerCase() !== 'n/a' && val !== '-' && val !== '0';

            if (isUsed(desferoxamine)) {
                const doseMg = parseFloat(desferoxamine);
                const daysNum = parseFloat(desfeDays);
                const wtNum = parseFloat(weight);
                
                let calcInfo = "";
                if (!isNaN(doseMg) && !isNaN(wtNum) && wtNum > 0) {
                    const meanDailyMg = (doseMg * daysNum) / wtNum / 7;
                    calcInfo = `\n  ↳ Mean Daily Dose: ${meanDailyMg.toFixed(2)} mg/kg/day`;
                    
                    const ferrNum = parseFloat(ferritin);
                    if (!isNaN(ferrNum) && ferrNum > 0) {
                        const ti = meanDailyMg / ferrNum;
                        calcInfo += `\n  ↳ Therapeutic Index: ${ti.toFixed(4)}`;
                    }
                } else {
                    calcInfo = `\n  ↳ (Enter Patient Weight to auto-calculate Mean Daily Dose)`;
                }

                let missedText = desfeMissed ? `\n  ↳ Missed Doses: ${desfeMissed}` : '\n  ↳ Missed Doses: None';
                
                let prepAdminText = `
  [Preparation & Administration]
  ↳ Independence: ${desfeIndep}
  ↳ Vol of WFI per dose: ${desfeWfi}
  ↳ Time start/stop: ${desfeTime}
  ↳ Injection Site: ${desfeSite} (Rotation: ${desfeRotation})
  ↳ Site Issues: ${desfeSiteIssues}
  ↳ Barriers: ${desfeBarriers}
  ↳ Needles: Single Use (${desfeSingleUse}), Correct Disposal (${desfeDisposal})`;

                let adjunctText = `
  [Adjunct Therapy]
  ↳ Vitamin C Intake: ${vitC} (Correct Intake: ${vitCCorrect})
  ↳ Local Anaesthesia (EMLA): ${emla}`;
                
                chelationDrugsText += `Desferoxamine (SC): ${desferoxamine} mg x ${desfeDays} days/week${calcInfo}${missedText}${prepAdminText}${adjunctText}\n\n`;
            }
            
            if (isUsed(deferiproneDose)) {
                chelationDrugsText += `Deferiprone: ${deferiproneDose}\n`;
            }
            if (isUsed(deferasiroxDose)) {
                chelationDrugsText += `Deferasirox: ${deferasiroxDose}\n`;
            }
            
            if (chelationDrugsText === "") {
                chelationDrugsText = "None prescribed\n";
            }

            // Section 4
            const adverseEvents = document.getElementById('adverseEvents').value || 'N/A';

            // Section 5
            const diet = document.getElementById('diet').value;
            const splenectomy = document.getElementById('splenectomy').value;
            const physicalActivity = document.getElementById('physicalActivity').value || '-';
            const vaccines = document.getElementById('vaccines').value || '-';

            // Section 6
            const otherIssues = document.getElementById('otherIssues').value || '-';
            const plan = document.getElementById('plan').value || '-';
            const tcaTmtac = document.getElementById('tcaTmtac').value || '-';
            const tcaDr = document.getElementById('tcaDr').value || '-';

            const noteText = `=== TMTAC PHARMACIST NOTES ===
Date: ${formattedDate}
Visit Number: ${visitNumber}
Weight (kg): ${weight || '-'}
Diagnosis: ${diagnosis}
Transfusional Types: ${finalTransfusionText}

[ LAB INVESTIGATIONS ]
Serum Ferritin (ng/mL): ${ferritin || '-'}
Neutrophil Count: ${neutrophil}
MRI T2* (Cardiac): ${mriCardiac}
MRI T2* (Liver): ${mriLiver}

[ CHELATION THERAPY ]
${chelationDrugsText}
[ PILL COUNTS & COMPLIANCE ]
Overall Compliance: ${compliance}
Balance Pill Counts: ${pillCounts}

[ DRUG ADVERSE EVENT / REACTION MONITORING ]
Reported Issues: ${adverseEvents}

[ LIFESTYLE & HISTORY ]
Low-iron diet adherence: ${diet}
Physical Activity: ${physicalActivity}
History of Splenectomy: ${splenectomy}
Vaccination Status: ${vaccines}

[ PHARMACIST ASSESSMENT & PLAN ]
Other Issues: 
${otherIssues}

Plan: 
${plan}

TCA TMTAC: ${tcaTmtac}
TCA DR: ${tcaDr}`;

            noteDisplay.textContent = noteText;
        }

        inputs.forEach(input => {
            input.addEventListener('input', generateNote);
            input.addEventListener('change', generateNote);
        });

        function copyNote() {
            const textToCopy = noteDisplay.textContent;
            navigator.clipboard.writeText(textToCopy).then(() => {
                const btn = document.querySelector('.copy-btn');
                const originalText = btn.textContent;
                btn.textContent = "✓ Copied Successfully!";
                btn.style.background = "#059669";
                setTimeout(() => { 
                    btn.textContent = originalText; 
                    btn.style.background = "#10b981";
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
                alert("Failed to copy. Please manually copy the text.");
            });
        }

        generateNote();
    </script>
</body>
</html>
